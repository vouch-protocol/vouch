openapi: 3.1.0
info:
    title: Vouch Assistant API
    version: "0.2.0"
    description: >
        Ask the hosted Vouch Assistant to run a signed action. Every action is
        signed by the assistant's DID (did:web:vouch-protocol.com:assistant) and
        verified before its output is released.
servers:
    - url: https://vouch-assistant.fly.dev
      description: Hosted Vouch Assistant
paths:
    /act:
        post:
            operationId: act
            summary: Run a signed action and return its output with the credential.
            description: >
                Runs one of a fixed set of actions. The assistant builds the output,
                signs an intent carrying a SHA-256 digest of that output, verifies the
                credential, and only then returns both. sign_sample returns a sample
                credential. generate_starter returns a starter project in Python or
                TypeScript. The signing key lives in the assistant's sidecar; no key
                material is exposed to ChatGPT.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ActRequest"
            responses:
                "200":
                    description: The verified credential and the action's output.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ActResponse"
                "400":
                    description: Unknown action or bad parameters.
                "503":
                    description: Signing is unavailable, so the action did not run.
    /audit:
        get:
            operationId: recentCredentials
            summary: List recent credentials emitted by the assistant.
            parameters:
                - in: query
                  name: limit
                  schema:
                      type: integer
                      default: 20
                      maximum: 100
            responses:
                "200":
                    description: Recent credential summaries.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuditResponse"
    /.well-known/did.json:
        get:
            operationId: didDocument
            summary: The assistant's DID document, for verifying its credentials.
            responses:
                "200":
                    description: DID document with a Multikey verification method.
                    content:
                        application/json:
                            schema:
                                type: object
components:
    schemas:
        ActRequest:
            type: object
            required: [action]
            properties:
                action:
                    type: string
                    enum: [sign_sample, generate_starter]
                params:
                    type: object
                    properties:
                        language:
                            type: string
                            enum: [python, typescript]
                            description: Required for generate_starter.
        ActResponse:
            type: object
            properties:
                credential:
                    type: object
                verified:
                    type: boolean
                result:
                    type: object
                    description: For generate_starter, a "files" map of file name to contents.
                audit:
                    type: object
        Intent:
            type: object
            properties:
                action:
                    type: string
                target:
                    type: string
                resource:
                    type: string
                outputDigest:
                    type: string
        AuditEntry:
            type: object
            properties:
                id:
                    type: string
                issuer:
                    type: string
                validFrom:
                    type: string
                intent:
                    $ref: "#/components/schemas/Intent"
                cryptosuite:
                    type: string
        AuditResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: "#/components/schemas/AuditEntry"
