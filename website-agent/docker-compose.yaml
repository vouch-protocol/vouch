version: "3.9"

# One container runs both the signing sidecar (localhost only) and the chat
# server; see backend/start.sh. Generate a key once with
#   python -m vouch_agent.sidecar --generate-key
# and pass it in VOUCH_AGENT_SIGNING_KEY.
services:
    vouch-agent:
        build: ./backend
        environment:
            VOUCH_AGENT_SIGNING_KEY: ${VOUCH_AGENT_SIGNING_KEY}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            VOUCH_AGENT_DID: ${VOUCH_AGENT_DID:-did:web:agent.vouch-protocol.com}
            VOUCH_CORS_ORIGINS: ${VOUCH_CORS_ORIGINS:-http://localhost:3000,https://vouch-protocol.com}
        ports:
            - "8000:8000"
