# Build and publish the signing sidecar container image.
#
# A pull request that touches the sidecar builds the image without publishing
# it. Publishing happens on a tag like `sidecar-v0.1.0`, or by a manual run.
#
# The image goes to GitHub Container Registry as
# ghcr.io/vouch-protocol/sidecar. When the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN repo secrets are set it also goes to Docker Hub as
# vouchprotocol/sidecar. Each published image is signed with cosign and
# carries a build provenance attestation.
name: Sidecar image

on:
  pull_request:
    paths:
      - "go-sidecar/**"
      - ".github/workflows/publish-sidecar-image.yml"
  push:
    tags: ["sidecar-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GHCR_IMAGE: ghcr.io/vouch-protocol/sidecar
      DOCKERHUB_IMAGE: vouchprotocol/sidecar
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out image names and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.PUBLISH == 'true' && env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=match,pattern=sidecar-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/sidecar-v') }}
            type=sha

      - name: Build the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: go-sidecar
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v4

      - name: Sign the published image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            cosign sign --yes "docker.io/${DOCKERHUB_IMAGE}@${DIGEST}"
          fi

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
